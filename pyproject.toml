[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "noserverai"
version = "0.1.0"
description = "Run AI models on cheap phones without cloud"
authors = [{name = "NoServerAI Team"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.8"

[project.dependencies]
numpy = "*"

[tool.maturin]
python-source = "python"
